name: Install zamokctl and the Sparkle tools
description: >
  Installs zamokctl, then fetches Sparkle's CLI tools (generate_appcast,
  generate_keys) from Sparkle's own release tarball and exports SPARKLE_BIN.

inputs:
  sparkle-version:
    description: Sparkle release tag to fetch tools from
    required: false
    default: "2.9.6"
  sparkle-sha256:
    description: sha256 of the Sparkle-<version>.tar.xz asset for sparkle-version
    required: false
    default: "52bf9e88cdd972fc0c81501377a880e90d47031bd8ca5462488f843e2609e192"

runs:
  using: composite
  steps:
    - name: Install zamokctl
      shell: bash
      run: brew install bshk-app/tap/zamokctl

    - name: Check the Sparkle pin against Package.resolved
      shell: bash
      env:
        SPARKLE_VERSION: ${{ inputs.sparkle-version }}
      run: |
        linked="$(jq -r '.pins[] | select(.identity=="sparkle") | .state.version' Package.resolved)"
        if [[ "$linked" != "$SPARKLE_VERSION" ]]; then
          echo "Sparkle pin drift: the app links $linked, this action pins $SPARKLE_VERSION."
          echo "Bump the sparkle-version/sparkle-sha256 inputs together -- the digest is per-version."
          exit 1
        fi

    - name: Download and verify the Sparkle tools
      shell: bash
      env:
        SPARKLE_VERSION: ${{ inputs.sparkle-version }}
        SPARKLE_SHA256: ${{ inputs.sparkle-sha256 }}
      run: |
        curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" \
          "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
        echo "${SPARKLE_SHA256}  $RUNNER_TEMP/sparkle.tar.xz" | shasum -a 256 -c -
        mkdir -p "$RUNNER_TEMP/sparkle"
        tar -xJf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
        # A tarball that unpacked into a different shape must fail here, not
        # later inside zamokctl with a path it cannot explain.
        [[ -x "$RUNNER_TEMP/sparkle/bin/generate_appcast" ]] \
          || { echo "no generate_appcast in the Sparkle tarball"; exit 1; }
        echo "SPARKLE_BIN=$RUNNER_TEMP/sparkle/bin" >> "$GITHUB_ENV"
