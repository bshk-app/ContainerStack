# Build and test only. Signing/notarization lives in release.yml, where secrets
# are available and every release step runs as one pipeline.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # ContainerStack targets .macOS(.v26); older images cannot resolve the manifest.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Report toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build every product
        run: |
          swift build --product ContainerStack
          swift build --product cstack
          swift build --product ContainerStackRuntime

      # No runtime, no daemon, no socket on a hosted runner: these suites cover
      # parsing, state rules and view models, which is what CI can honestly test.
      - name: Test
        run: swift test

  lint:
    # Style is machine-owned so review can spend itself on behaviour: swift-format
    # holds layout, SwiftLint holds size, complexity and naming. Leaving both on
    # their layout rules made them fight, so .swiftlint.yml delegates those.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Formatting
        run: swift format lint --strict -r -p Sources Tests

      - name: SwiftLint
        run: |
          brew install swiftlint
          swiftlint lint --quiet --strict

      # The shell that ships on macOS is bash 3.2, and it is stricter than any
      # newer one: it tracks quotes through comments inside a command
      # substitution, so an apostrophe there stops the parser. `#!/usr/bin/env
      # bash` finds 5.x wherever Homebrew bash exists, and the ubuntu runner has
      # no 3.2 at all, so this sweep has to run here and name /bin/bash.
      - name: Parse every shell script under the shell macOS ships
        run: |
          /bin/bash -c 'echo "bash ${BASH_VERSION}"'
          for f in scripts/*.sh scripts/hooks/*.sh .githooks/*; do
            [ -f "$f" ] || continue
            /bin/bash -n "$f"
          done

  scripts:
    # The release path itself cannot run here, but its scripts are where this
    # repo has actually broken: a stale copy published to the wrong store, and a
    # retry that recomputed the build number. Parse and lint them every push.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Hook scripts and .githooks are the files most recently broken, and
      # `scripts/*.sh` matched neither. The list is built rather than globbed
      # straight into the command: an unmatched glob would reach shellcheck as a
      # literal and fail the job, and a future README or directory under
      # .githooks is not shell.
      - name: Shellcheck
        run: |
          files=""
          for f in scripts/*.sh scripts/hooks/*.sh .githooks/*; do
            [ -f "$f" ] || continue
            case "$f" in
              *.sh) ;;
              *) head -1 "$f" | grep -q '^#!.*\(ba\)\?sh' || continue ;;
            esac
            files="$files $f"
          done
          [ -n "$files" ] || { echo "no shell files found - the globs are wrong"; exit 1; }
          echo "shellcheck over:$files"
          # shellcheck disable=SC2086 # the list is built from a controlled glob
          shellcheck --severity=error $files

      # An invalid workflow file is not a parse error YAML can see: putting the
      # `runner` context in a job-level `env:` produced a run whose only symptom
      # was a failure named after the file. actionlint knows the context rules.
      - name: Lint the workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"
