# Release on a GitHub Release you create by hand.
#
# The pipeline itself is scripts/release.sh -- the same script a human runs.
# This file only assembles the environment that script expects, because
# duplicating the pipeline in YAML is how the two copies drift apart.
#
# Publishing needs a new commit: the Sparkle build number is
# BUILD_NUMBER_BASE + commit count, and a Sparkle build number is monotonic and
# unrecallable. Tag the commit you want, publish the release, and this runs.
name: Release

on:
  release:
    # `published`, not `created`: GitHub does not fire created/edited/deleted for
    # draft releases, and the UI saves a new release as a draft, so the obvious
    # way to write a body by hand would never start this. `published` covers a
    # direct publish and a draft being published, stable and prerelease alike.
    types: [published]

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      RELEASE_CHANNEL: ${{ github.event.release.prerelease && 'beta' || 'stable' }}
      SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
      # Optional: the tap is another repository, so github.token cannot write
      # it. Unset means the release still ships; only the cask lags.
      TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
      SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
      RELEASE_SIGNING_IDENTITY_SHA1: ${{ secrets.RELEASE_SIGNING_IDENTITY_SHA1 }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
      GITHUB_RELEASE_REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # fetch-depth: 0 is load-bearing. build-number.sh counts commits, and a
      # shallow clone would count 1 -- a build number below every release so far,
      # which Sparkle would treat as a downgrade.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      # Outside the workspace on purpose: release.sh refuses a dirty tree, and an
      # untracked directory in the checkout is dirty. Set in a step rather than
      # the job `env:`, where the `runner` context is unavailable -- putting it
      # there made the whole workflow file invalid, which GitHub reports only as
      # a failed run named after the file.
      - name: Point at the sidecar outside the workspace
        run: echo "SOCKTAINER_BINARY=$RUNNER_TEMP/socktainer-bin/socktainer" >> "$GITHUB_ENV"

      - name: Check the tag matches VERSION
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          expected="v${version}"
          [[ "$RELEASE_CHANNEL" == "stable" ]] || expected="v${version}-${RELEASE_CHANNEL}"
          [[ "${{ github.event.release.tag_name }}" == "$expected" ]] \
            || { echo "tag ${{ github.event.release.tag_name }} does not match $expected from VERSION"; exit 1; }

      # CHANGELOG.md is the release-notes SSOT, and the appcast and the GitHub
      # body must be the same bytes. Fail here rather than ship two stories.
      - name: Check the release body matches CHANGELOG
        run: |
          # $(...) drops the trailing newline the API adds, and tr drops CR: a
          # body typed in the browser is stored CRLF. Neither is a difference in
          # the story being told.
          notes="$(./scripts/extract-release-notes.sh "$(tr -d '[:space:]' < VERSION)" CHANGELOG.md)"
          body="$(gh release view "${{ github.event.release.tag_name }}" --json body --jq .body | tr -d '\r')"
          diff -u <(printf '%s' "$notes") <(printf '%s' "$body") \
            || { echo "release body differs from the CHANGELOG section"; exit 1; }

      - name: Install zamokctl and the Sparkle tools
        run: |
          brew install bshk-app/tap/zamokctl
          brew install --cask sparkle

      - name: Cache the socktainer sidecar
        id: socktainer
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/socktainer-bin
          key: socktainer-${{ hashFiles('scripts/prepare-v1-runtime.sh') }}

      # Built from the pinned fork, never from HEAD: the pin carries three fixes
      # the app depends on. task runtime:check verifies the staged binary reports
      # that revision.
      - name: Build the socktainer sidecar
        if: steps.socktainer.outputs.cache-hit != 'true'
        run: |
          ./scripts/prepare-v1-runtime.sh build-socktainer
          mkdir -p "$RUNNER_TEMP/socktainer-bin"
          install -m 0755 "$HOME/.local/bin/socktainer" "$RUNNER_TEMP/socktainer-bin/socktainer"

      - name: Report the staged sidecar
        run: ./scripts/check-socktainer.sh

      # A keychain scoped to this runner. The Developer ID never lands in the
      # repository, and the runner is discarded after the job.
      - name: Import the Developer ID
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$password" "$keychain" >/dev/null
          # Preserve the existing search list: `list-keychains -s` replaces it
          # outright, and dropping the login keychain breaks later lookups. Read
          # into an array so a path with spaces stays one argument.
          existing=()
          while IFS= read -r entry; do
            existing+=("${entry//\"/}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          security find-identity -v -p codesigning "$keychain"

      - name: Write the notary key
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          chmod 600 "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      # Same script a human runs: stage, codesign, notarize, staple, DMG,
      # publish to Zamok, upload the GitHub asset, then externalize the enclosure.
      - name: Release
        env:
          PUBLISH: "1"
        run: ./scripts/release.sh

      - name: Remove the keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/notary.p8"
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
