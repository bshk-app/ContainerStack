# Detection for the comment-block gate, kept out of .swiftlint.yml on purpose:
# repo-wide this rule flags every existing comment, so it is only ever run
# through the diff filter in scripts/hooks/check-new-comment-blocks.sh, which
# reports only what a change actually added.
#
# `match_kinds` is why this is a rule and not a hand-written scanner: SourceKit
# token kinds exclude `//` lines inside a `"""` literal, which a regex over raw
# text cannot do.
#
# `^` is not anchored per line here: SwiftLint compiles custom rules without
# anchorsMatchLines, so a leading `^` silently matches nothing.

only_rules:
  - long_comment_block

custom_rules:
  long_comment_block:
    name: "New comment block"
    # `(?:\n|$)` so a block that ends the file without a trailing newline is
    # still a block.
    regex: '(?:[ \t]*\/\/[^\n]*(?:\n|$)){1,}'
    match_kinds:
      - comment
      - doccomment
    message: "New comment: state a checkable invariant, not an assumption -- verify it against the code or the source it claims, don't just doubt it in review."
    severity: warning
